<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TUE Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">
    <div class="max-w-2xl mx-auto space-y-6">
        <!-- News Section -->
        <div class="bg-black text-white p-6 rounded-3xl shadow-lg">
            <h2 class="text-lg font-bold mb-3">📢 Update Website News</h2>
            <input id="alertMsg" type="text" placeholder="Eid Sale or New Arrival Message" class="w-full p-3 bg-zinc-800 rounded-lg mb-3 text-white">
            <div class="flex gap-3">
                <button onclick="updateAlert()" class="w-2/3 bg-yellow-600 hover:bg-yellow-500 p-3 rounded-lg font-bold">Update News</button>
                <button onclick="deleteAlert()" class="w-1/3 bg-red-600 hover:bg-red-500 p-3 rounded-lg font-bold">Remove News</button>
            </div>
        </div>

        <!-- Add Watch Section -->
        <div class="bg-white p-6 rounded-3xl shadow-lg border">
            <h2 class="text-lg font-bold mb-4">⌚ Add Watch to Stock</h2>
            <input id="wName" type="text" placeholder="Watch Name" class="w-full p-3 mb-3 border rounded-lg">
            <div class="flex gap-3 mb-3">
                <input id="wPrice" type="number" placeholder="Price" class="w-1/2 p-3 border rounded-lg">
                <input id="wStock" type="number" placeholder="Stock Qty" class="w-1/2 p-3 border rounded-lg">
            </div>
            <input id="wUrl" type="text" placeholder="Image Link (from Postimages)" class="w-full p-3 mb-4 border rounded-lg">
            <button onclick="addWatch()" id="btn" class="w-full bg-black text-white p-4 rounded-lg font-bold">ADD TO WEBSITE</button>
        </div>

        <!-- Inventory Management Section (Delete Watch) -->
        <div class="bg-white p-6 rounded-3xl shadow-lg border">
            <h2 class="text-lg font-bold mb-4">🗑️ Manage Inventory & Delete Watches</h2>
            <div id="admin-watch-list" class="space-y-3">
                <p class="text-gray-500 text-sm">Loading stock...</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBdmv6OXxJt3VM-xybMMc0LrgFmv4AfjYg",
            authDomain: "tuewatchstore.firebaseapp.com",
            projectId: "tuewatchstore",
            appId: "1:982689793085:web:eb92ea1952692b083a5654"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 1. News Functions
        window.updateAlert = async () => {
            const msg = document.getElementById('alertMsg').value;
            await setDoc(doc(db, "settings", "announcement"), { text: msg });
            alert("News Updated!");
        };

        window.deleteAlert = async () => {
            await setDoc(doc(db, "settings", "announcement"), { text: "" });
            alert("News Removed!");
        };

        // 2. Add Watch Function
        window.addWatch = async () => {
            const name = document.getElementById('wName').value;
            const price = document.getElementById('wPrice').value;
            const stock = document.getElementById('wStock').value;
            const url = document.getElementById('wUrl').value;
            
            if(!name || !price || !url) { alert("Sari details bharein!"); return; }

            await addDoc(collection(db, "watches"), {
                name, price, stock: Number(stock), url, sales: 0
            });
            alert("Watch Added!");
            location.reload();
        };

        // 3. Delete Watch Function
        window.deleteWatch = async (id) => {
            if(confirm("Kya aap is watch ko permanently delete karna chahte hain?")) {
                await deleteDoc(doc(db, "watches", id));
                alert("Watch deleted successfully!");
            }
        };

        // 4. Realtime Load Watches with Delete Action
        onSnapshot(collection(db, "watches"), (snapshot) => {
            const container = document.getElementById('admin-watch-list');
            container.innerHTML = "";
            
            if(snapshot.empty) {
                container.innerHTML = "<p class='text-gray-500 text-sm'>No watches in inventory.</p>";
                return;
            }

            snapshot.forEach((doc) => {
                const w = doc.data();
                container.innerHTML += `
                    <div class="flex items-center justify-between p-3 border rounded-xl bg-gray-50">
                        <div class="flex items-center gap-3">
                            <img src="${w.url}" class="w-12 h-12 object-cover rounded-lg">
                            <div>
                                <p class="font-bold text-sm text-black">${w.name}</p>
                                <p class="text-xs text-gray-500">Rs. ${w.price} | Stock: ${w.stock}</p>
                            </div>
                        </div>
                        <button onclick="deleteWatch('${doc.id}')" class="bg-red-600 hover:bg-red-700 text-white text-xs px-3 py-2 rounded-lg font-bold">Delete</button>
                    </div>
                `;
            });
        });
    </script>
</body>
</html>
