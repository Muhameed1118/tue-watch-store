<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TUE Admin | Full Control Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #080808; color: #fff; font-family: 'Inter', sans-serif; }
        .gold-border { border-color: #d4af37; }
        .gold-btn { background: #d4af37; color: #000; font-weight: 800; }
    </style>
</head>
<body class="p-4 max-w-xl mx-auto space-y-6 pb-20">

    <!-- ANNOUNCEMENT CONTROL BOX -->
    <div class="bg-zinc-900/90 p-5 rounded-2xl border border-zinc-800 shadow-2xl">
        <h3 class="text-sm font-black text-[#d4af37] uppercase tracking-wider mb-3">📢 Top Announcement Bar</h3>
        <div class="space-y-3">
            <input type="text" id="announcement-text" placeholder="e.g. Free Delivery All Over Pakistan!" 
                   class="w-full bg-black border border-zinc-800 rounded-xl p-3 text-xs focus:border-[#d4af37] outline-none">
            <div class="flex gap-2">
                <button onclick="updateAnnouncement()" class="flex-1 py-2.5 gold-btn rounded-xl text-xs uppercase tracking-wider">Save Banner</button>
                <button onclick="clearAnnouncement()" class="py-2.5 px-4 bg-red-950 text-red-400 border border-red-800 rounded-xl text-xs font-bold uppercase">Clear</button>
            </div>
        </div>
        <p id="anc-status" class="text-[10px] mt-2 font-bold text-center"></p>
    </div>

    <!-- WATCH UPLOAD FORM -->
    <div class="bg-zinc-900/90 p-6 rounded-2xl border border-zinc-800 shadow-2xl">
        <h2 class="text-2xl font-black text-[#d4af37] tracking-tight mb-2 uppercase italic text-center">TUE Watch Admin</h2>
        <p class="text-xs text-zinc-500 text-center mb-6">Add New Watch with Custom Tag & Direct Upload</p>

        <form id="upload-form" class="space-y-4">
            <div>
                <label class="text-xs font-bold text-zinc-400 block mb-1">WATCH NAME</label>
                <input type="text" id="watch-name" placeholder="e.g. Cartier" required
                    class="w-full bg-black border border-zinc-800 rounded-xl p-3 text-sm focus:border-[#d4af37] outline-none">
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="text-xs font-bold text-zinc-400 block mb-1">PRICE (PKR)</label>
                    <input type="number" id="watch-price" placeholder="2500" required
                        class="w-full bg-black border border-zinc-800 rounded-xl p-3 text-sm focus:border-[#d4af37] outline-none">
                </div>
                <div>
                    <label class="text-xs font-bold text-zinc-400 block mb-1">INITIAL STOCK</label>
                    <input type="number" id="watch-stock" placeholder="10" required
                        class="w-full bg-black border border-zinc-800 rounded-xl p-3 text-sm focus:border-[#d4af37] outline-none">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="text-xs font-bold text-zinc-400 block mb-1">COLOR NAMES (Comma Separated)</label>
                    <input type="text" id="watch-colors" placeholder="e.g. Green, Silver, Blue" required
                        class="w-full bg-black border border-zinc-800 rounded-xl p-3 text-sm focus:border-[#d4af37] outline-none">
                </div>
                <div>
                    <label class="text-xs font-bold text-zinc-400 block mb-1">CARD BADGE / TAG</label>
                    <select id="watch-tag" class="w-full bg-black border border-zinc-800 rounded-xl p-3 text-sm focus:border-[#d4af37] outline-none text-zinc-300">
                        <option value="">No Tag</option>
                        <option value="Top Selling">🔥 Top Selling</option>
                        <option value="Hot Item">⚡ Hot Item</option>
                        <option value="New Arrival">✨ New Arrival</option>
                        <option value="Limited Edition">💎 Limited Edition</option>
                        <option value="Sale">🏷️ Special Sale</option>
                    </select>
                </div>
            </div>

            <div class="p-4 bg-black border border-dashed border-zinc-700 rounded-xl text-center">
                <label class="text-xs font-bold text-[#d4af37] block mb-2 cursor-pointer">
                    📱 TAP TO SELECT PHOTOS FROM GALLERY
                </label>
                <input type="file" id="watch-images" multiple accept="image/*" class="hidden" onchange="previewFiles(this)">
                <button type="button" onclick="document.getElementById('watch-images').click()" 
                    class="py-2 px-4 bg-zinc-800 hover:bg-zinc-700 text-xs rounded-lg font-semibold">
                    Choose Watch Photos
                </button>
                <p id="file-count" class="text-[11px] text-emerald-400 mt-2 font-mono"></p>
            </div>

            <button type="submit" id="submit-btn" 
                class="w-full py-4 gold-btn rounded-xl uppercase text-xs tracking-wider transition-all">
                Upload Watch & Save
            </button>
        </form>

        <div id="status-msg" class="mt-4 text-center text-xs font-bold"></div>
    </div>

    <!-- MANAGE & DELETE WATCHES SECTION -->
    <div class="bg-zinc-900/90 p-6 rounded-2xl border border-zinc-800 shadow-2xl">
        <div class="flex justify-between items-center mb-4">
            <h3 class="text-base font-black text-[#d4af37] uppercase tracking-wider">📦 Manage Inventory & Badges</h3>
            <button onclick="loadWatchesList()" class="text-xs text-zinc-400 hover:text-white underline">Refresh List</button>
        </div>

        <div id="watches-list" class="space-y-4">
            <p class="text-xs text-zinc-500 text-center">Loading watches list...</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, doc, setDoc, getDoc, getDocs, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBdmv6OXxJt3VM-xybMMc0LrgFmv4AfjYg",
            authDomain: "tuewatchstore.firebaseapp.com",
            projectId: "tuewatchstore",
            appId: "1:982689793085:web:eb92ea1952692b083a5654"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Announcement Functions
        window.loadAnnouncement = async () => {
            try {
                const docSnap = await getDoc(doc(db, "settings", "announcement"));
                if (docSnap.exists() && docSnap.data().text) {
                    document.getElementById('announcement-text').value = docSnap.data().text;
                }
            } catch (err) { console.error(err); }
        };

        window.updateAnnouncement = async () => {
            const txt = document.getElementById('announcement-text').value.trim();
            const ancStatus = document.getElementById('anc-status');
            try {
                await setDoc(doc(db, "settings", "announcement"), { text: txt });
                ancStatus.innerText = "✅ Announcement Updated Successfully!";
                ancStatus.className = "text-[10px] mt-2 font-bold text-center text-emerald-400";
            } catch (err) {
                ancStatus.innerText = "❌ Error saving announcement";
                ancStatus.className = "text-[10px] mt-2 font-bold text-center text-red-500";
            }
        };

        window.clearAnnouncement = async () => {
            document.getElementById('announcement-text').value = "";
            await window.updateAnnouncement();
        };

        window.previewFiles = (input) => {
            const countEl = document.getElementById('file-count');
            if (input.files.length > 0) {
                countEl.innerText = `Selected ${input.files.length} Photo(s) (1st Photo = Cover)`;
            } else {
                countEl.innerText = "";
            }
        };

        // Image Compression helper
        const compressImage = (file) => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        const maxWidth = 700;

                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', 0.75));
                    };
                    img.onerror = reject;
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        };

        // Upload Form Listener
        document.getElementById('upload-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const status = document.getElementById('status-msg');
            const btn = document.getElementById('submit-btn');

            const files = document.getElementById('watch-images').files;
            if (files.length === 0) {
                status.innerText = "❌ Please select at least 1 image from gallery!";
                status.className = "text-red-500 text-center text-xs mt-4 font-bold";
                return;
            }

            btn.disabled = true;
            btn.innerText = "Processing Photos... Please Wait";
            status.innerText = "⏳ Processing and saving images...";
            status.className = "text-yellow-400 text-center text-xs mt-4 font-bold";

            try {
                const processedUrls = [];
                for (let i = 0; i < files.length; i++) {
                    status.innerText = `⏳ Processing photo ${i + 1} of ${files.length}...`;
                    const base64Img = await compressImage(files[i]);
                    processedUrls.push(base64Img);
                }

                const name = document.getElementById('watch-name').value;
                const price = Number(document.getElementById('watch-price').value);
                const stock = Number(document.getElementById('watch-stock').value);
                const colorsInput = document.getElementById('watch-colors').value;
                const tagInput = document.getElementById('watch-tag').value;

                await addDoc(collection(db, "watches"), {
                    name: name,
                    price: price,
                    stock: stock,
                    sales: 0,
                    tag: tagInput || "",
                    url: processedUrls.join(','),
                    colors: colorsInput
                });

                status.innerText = "✅ Watch Saved Successfully!";
                status.className = "text-emerald-400 text-center text-xs mt-4 font-bold";
                document.getElementById('upload-form').reset();
                document.getElementById('file-count').innerText = "";
                window.loadWatchesList();
            } catch (err) {
                console.error(err);
                status.innerText = "❌ Error uploading: " + err.message;
                status.className = "text-red-500 text-center text-xs mt-4 font-bold";
            } finally {
                btn.disabled = false;
                btn.innerText = "Upload Watch & Save";
            }
        });

        // Load Watches List
        window.loadWatchesList = async () => {
            const container = document.getElementById('watches-list');
            container.innerHTML = `<p class="text-xs text-zinc-500 text-center py-4">Loading watches...</p>`;
            try {
                const querySnapshot = await getDocs(collection(db, "watches"));
                if (querySnapshot.empty) {
                    container.innerHTML = `<p class="text-xs text-zinc-500 text-center py-4">No watches uploaded yet.</p>`;
                    return;
                }

                let html = '';
                querySnapshot.forEach((docSnap) => {
                    const w = docSnap.data();
                    const id = docSnap.id;
                    const firstImg = w.url ? w.url.split(',')[0] : '';

                    html += `
                        <div class="bg-black/60 border border-zinc-800 rounded-xl p-3 flex flex-col gap-3">
                            <div class="flex items-center gap-3">
                                <img src="${firstImg}" class="w-12 h-12 object-cover rounded-lg border border-zinc-700">
                                <div class="flex-1 min-w-0">
                                    <h4 class="text-xs font-bold text-white truncate">${w.name}</h4>
                                    <p class="text-[10px] text-zinc-400">Colors: ${w.colors || 'N/A'}</p>
                                </div>
                                <button onclick="window.deleteWatch('${id}')" class="bg-red-950/80 hover:bg-red-900 border border-red-800 text-red-400 px-3 py-1.5 rounded-lg text-[10px] font-bold">
                                    🗑️ Delete
                                </button>
                            </div>

                            <div class="grid grid-cols-3 gap-2 bg-zinc-950 p-2 rounded-lg border border-zinc-800/80">
                                <div>
                                    <label class="text-[9px] font-bold text-zinc-500 block mb-0.5">PRICE (PKR)</label>
                                    <input type="number" id="price-${id}" value="${w.price || 0}" class="w-full bg-black border border-zinc-800 rounded p-1 text-xs text-zinc-200">
                                </div>
                                <div>
                                    <label class="text-[9px] font-bold text-zinc-500 block mb-0.5">STOCK</label>
                                    <input type="number" id="stock-${id}" value="${w.stock || 0}" class="w-full bg-black border border-zinc-800 rounded p-1 text-xs text-zinc-200">
                                </div>
                                <div>
                                    <label class="text-[9px] font-bold text-zinc-500 block mb-0.5">TAG/BADGE</label>
                                    <select id="tag-${id}" class="w-full bg-black border border-zinc-800 rounded p-1 text-[10px] text-zinc-200">
                                        <option value="" ${!w.tag ? 'selected' : ''}>None</option>
                                        <option value="Top Selling" ${w.tag === 'Top Selling' ? 'selected' : ''}>Top Selling</option>
                                        <option value="Hot Item" ${w.tag === 'Hot Item' ? 'selected' : ''}>Hot Item</option>
                                        <option value="New Arrival" ${w.tag === 'New Arrival' ? 'selected' : ''}>New Arrival</option>
                                        <option value="Limited Edition" ${w.tag === 'Limited Edition' ? 'selected' : ''}>Limited Edition</option>
                                        <option value="Sale" ${w.tag === 'Sale' ? 'selected' : ''}>Special Sale</option>
                                    </select>
                                </div>
                            </div>

                            <button onclick="window.updateWatch('${id}')" class="w-full py-1.5 bg-zinc-800 hover:bg-zinc-700 text-[#d4af37] border border-zinc-700 rounded-lg text-[10px] font-bold uppercase tracking-wider">
                                Save Changes
                            </button>
                        </div>
                    `;
                });
                container.innerHTML = html;
            } catch (err) {
                console.error(err);
                container.innerHTML = `<p class="text-xs text-red-500 text-center py-4">Error loading list.</p>`;
            }
        };

        // Global Update Watch
        window.updateWatch = async (id) => {
            const price = Number(document.getElementById(`price-${id}`).value);
            const stock = Number(document.getElementById(`stock-${id}`).value);
            const tag = document.getElementById(`tag-${id}`).value;

            try {
                await updateDoc(doc(db, "watches", id), {
                    price: price,
                    stock: stock,
                    tag: tag
                });
                alert("✅ Watch updated successfully!");
                window.loadWatchesList();
            } catch (err) {
                alert("❌ Error updating: " + err.message);
            }
        };

        // Global Delete Watch
        window.deleteWatch = async (id) => {
            if (confirm("Are you sure you want to delete this watch?")) {
                try {
                    await deleteDoc(doc(db, "watches", id));
                    alert("🗑️ Watch deleted successfully!");
                    window.loadWatchesList();
                } catch (err) {
                    alert("❌ Error deleting: " + err.message);
                }
            }
        };

        // Initial setup calls
        window.loadAnnouncement();
        window.loadWatchesList();
    </script>
</body>
</html>
