<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Lab - Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        ::selection {
            background-color: #d4af37;
            color: #000000;
        }

        body {
            background-color: #0f0f0f;
            color: #f3f4f6;
            padding: 20px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 1px solid #262626;
            padding-bottom: 15px;
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
            color: #d4af37;
        }

        .back-link {
            color: #d4af37;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
        }

        .card-box {
            background: #161616;
            border: 1px solid #262626;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 15px;
            font-weight: 600;
            color: #d4af37;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            color: #9ca3af;
            margin-bottom: 6px;
        }

        .form-control {
            width: 100%;
            padding: 10px 12px;
            background: #222;
            border: 1px solid #333;
            color: white;
            border-radius: 8px;
            font-size: 13px;
            outline: none;
        }

        textarea.form-control {
            resize: vertical;
            height: 80px;
        }

        .form-control:focus {
            border-color: #d4af37;
        }

        .submit-btn {
            width: 100%;
            background-color: #d4af37;
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header-top">
        <div class="logo">Time Lab | Admin Panel</div>
        <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> View Website</a>
    </div>

    <!-- 0. Delivery Charges Settings Control -->
    <div class="card-box" style="border-color: #d4af37;">
        <div class="section-title"><i class="fa-solid fa-truck-fast"></i> Manage Delivery Charges (Courier Fee)</div>
        <form id="deliveryFeeForm">
            <div class="form-group">
                <label>Current Delivery Fee Amount (Rs.)</label>
                <input type="number" id="deliveryFeeInput" class="form-control" placeholder="e.g., 400" required>
            </div>
            <button type="submit" class="submit-btn">Update Delivery Charges</button>
        </form>
    </div>

    <!-- 1. Update Website Logo -->
    <div class="card-box">
        <div class="section-title"><i class="fa-solid fa-image"></i> Update Website Logo (Top-Left URL)</div>
        <form id="logoForm">
            <div class="form-group">
                <label>Logo Image URL (PNG Link)</label>
                <input type="url" id="logoUrlInput" class="form-control" placeholder="https://example.com/logo.png" required>
            </div>
            <button type="submit" class="submit-btn">Update Store Logo</button>
        </form>
    </div>

    <!-- 2. Upload AI Model Lookbook -->
    <div class="card-box">
        <div class="section-title"><i class="fa-solid fa-user-plus"></i> Add Model Lookbook (Via URL)</div>
        <form id="modelForm">
            <div class="form-group">
                <label>Model Style / Title</label>
                <input type="text" id="modelTitle" class="form-control" placeholder="e.g., Casual Look, Suit Vibe" required>
            </div>
            <div class="form-group">
                <label>Model Photo URL</label>
                <input type="url" id="modelUrlInput" class="form-control" placeholder="https://images.unsplash.com/..." required>
            </div>
            <button type="submit" class="submit-btn">Publish Model Look</button>
        </form>
    </div>

    <!-- 3. Add New Watch Product -->
    <div class="card-box">
        <div class="section-title"><i class="fa-solid fa-clock"></i> Add New Watch Product (Via URL)</div>
        <form id="watchForm">
            <div class="form-group">
                <label>Watch Name</label>
                <input type="text" id="watchName" class="form-control" placeholder="e.g., Time Lab Royal Black" required>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div class="form-group">
                    <label>Category (Tag)</label>
                    <select id="watchCategory" class="form-control">
                        <option value="Hot Selling">🔥 Hot Selling</option>
                        <option value="New Arrival">New Arrival</option>
                        <option value="Regular">Regular</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Strap Type</label>
                    <select id="watchStrap" class="form-control">
                        <option value="Leather Strap">Leather Strap</option>
                        <option value="Chain Strap">Chain Strap</option>
                        <option value="Silicon Strap">Silicon Strap</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>Price (Rs.)</label>
                <input type="number" id="watchPrice" class="form-control" placeholder="e.g., 4000" required>
            </div>

            <div class="form-group">
                <label>Watch Photo URL</label>
                <input type="url" id="watchUrlInput" class="form-control" placeholder="https://images.unsplash.com/..." required>
            </div>

            <button type="submit" class="submit-btn">Publish Watch to Store</button>
        </form>
    </div>

    <!-- 4. Add New Blog / Care Tip -->
    <div class="card-box">
        <div class="section-title"><i class="fa-solid fa-pen-nib"></i> Add Watch Care Tip / Blog</div>
        <form id="blogForm">
            <div class="form-group">
                <label>Tip Title</label>
                <input type="text" id="blogTitle" class="form-control" placeholder="e.g., How to Clean Glass Scratch" required>
            </div>
            <div class="form-group">
                <label>Tip Description / Details</label>
                <textarea id="blogDesc" class="form-control" placeholder="Write detailed instructions here..." required></textarea>
            </div>
            <button type="submit" class="submit-btn">Publish Blog Tip</button>
        </form>
    </div>

    <!-- 5. Update About Us Section -->
    <div class="card-box">
        <div class="section-title"><i class="fa-solid fa-circle-info"></i> Edit About Section</div>
        <form id="aboutForm">
            <div class="form-group">
                <label>About Us Description</label>
                <textarea id="aboutText" class="form-control" placeholder="Write your brand story here..." required></textarea>
            </div>
            <button type="submit" class="submit-btn">Update About Section</button>
        </form>
    </div>

    <!-- 6. Update Footer Section -->
    <div class="card-box">
        <div class="section-title"><i class="fa-solid fa-shoe-prints"></i> Edit Footer Details</div>
        <form id="footerForm">
            <div class="form-group">
                <label>Footer Description / Tagline</label>
                <input type="text" id="footerDesc" class="form-control" placeholder="e.g., Crafting timeless elegance..." required>
            </div>
            <div class="form-group">
                <label>Copyright Text</label>
                <input type="text" id="footerCopy" class="form-control" placeholder="e.g., © 2026 Time Lab. All Rights Reserved." required>
            </div>
            <button type="submit" class="submit-btn">Update Footer</button>
        </form>
    </div>

    <script>
        // Set initial delivery fee value in input on page load
        window.addEventListener("DOMContentLoaded", () => {
            const currentFee = localStorage.getItem("timelab_delivery_fee") || "400";
            document.getElementById("deliveryFeeInput").value = currentFee;
        });

        // Delivery Fee Handler
        document.getElementById("deliveryFeeForm").addEventListener("submit", function(e) {
            e.preventDefault();
            const fee = document.getElementById("deliveryFeeInput").value;
            localStorage.setItem("timelab_delivery_fee", fee);
            alert("Delivery Charges Updated Successfully to Rs. " + fee + "!");
        });

        document.getElementById("logoForm").addEventListener("submit", function(e) {
            e.preventDefault();
            const logoUrl = document.getElementById("logoUrlInput").value;
            localStorage.setItem("timelab_logo", logoUrl);
            alert("Store Logo URL Updated Successfully!");
            this.reset();
        });

        document.getElementById("modelForm").addEventListener("submit", function(e) {
            e.preventDefault();
            const title = document.getElementById("modelTitle").value;
            const image = document.getElementById("modelUrlInput").value;
            let models = JSON.parse(localStorage.getItem("timelab_models")) || [];
            models.push({ title, image });
            localStorage.setItem("timelab_models", JSON.stringify(models));
            alert("Model Photo Published Successfully!");
            this.reset();
        });

        document.getElementById("watchForm").addEventListener("submit", function(e) {
            e.preventDefault();
            const newWatch = {
                id: Date.now(),
                name: document.getElementById("watchName").value,
                category: document.getElementById("watchCategory").value,
                strap: document.getElementById("watchStrap").value,
                price: document.getElementById("watchPrice").value,
                image: document.getElementById("watchUrlInput").value
            };
            let watches = JSON.parse(localStorage.getItem("timelab_watches")) || [];
            watches.push(newWatch);
            localStorage.setItem("timelab_watches", JSON.stringify(watches));
            alert("Watch Published to Store Successfully!");
            this.reset();
        });

        document.getElementById("blogForm").addEventListener("submit", function(e) {
            e.preventDefault();
            const title = document.getElementById("blogTitle").value;
            const desc = document.getElementById("blogDesc").value;
            let blogs = JSON.parse(localStorage.getItem("timelab_blogs")) || [];
            blogs.push({ title, desc });
            localStorage.setItem("timelab_blogs", JSON.stringify(blogs));
            alert("Blog Tip Published Successfully!");
            this.reset();
        });

        document.getElementById("aboutForm").addEventListener("submit", function(e) {
            e.preventDefault();
            const aboutText = document.getElementById("aboutText").value;
            localStorage.setItem("timelab_about", aboutText);
            alert("About Section Updated Successfully!");
        });

        document.getElementById("footerForm").addEventListener("submit", function(e) {
            e.preventDefault();
            const footerDesc = document.getElementById("footerDesc").value;
            const footerCopy = document.getElementById("footerCopy").value;
            localStorage.setItem("timelab_footer_desc", footerDesc);
            localStorage.setItem("timelab_footer_copy", footerCopy);
            alert("Footer Updated Successfully!");
        });
    </script>
</body>
</html>
