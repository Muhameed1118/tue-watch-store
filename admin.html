<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TUE Admin | Control Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { background: #fbf9f5; color: #1f2921; font-family: 'Plus Jakarta Sans', sans-serif; }
        .olive-btn { background: #2b3a29; color: #fcfaf7; font-weight: 700; }
        .olive-btn:hover { background: #1e2a1c; }
        .font-serif-title { font-family: 'Playfair Display', serif; }
    </style>
</head>
<body class="p-4 sm:p-6 max-w-xl mx-auto space-y-6 pb-20 antialiased">

    <!-- ANNOUNCEMENT CONTROL BOX -->
    <div class="bg-white p-5 rounded-2xl border border-[#e2dacb] shadow-sm">
        <h3 class="text-xs font-bold text-[#2b3a29] uppercase tracking-widest mb-3">📢 Top Announcement Banner</h3>
        <div class="space-y-3">
            <input type="text" id="announcement-text" placeholder="e.g. Special Discount - Free Delivery Nationwide!" 
                   class="w-full bg-[#fbf9f5] border border-[#dcd4c3] rounded-xl p-3 text-xs focus:border-[#2b3a29] outline-none text-[#1f2921]">
            <div class="flex gap-2">
                <button id="btn-save-banner" type="button" class="flex-1 py-2.5 olive-btn rounded-xl text-xs uppercase tracking-wider shadow-sm">Save Banner</button>
                <button id="btn-clear-banner" type="button" class="py-2.5 px-4 bg-red-100 text-red-700 border border-red-200 rounded-xl text-xs font-bold uppercase">Clear</button>
            </div>
        </div>
        <p id="anc-status" class="text-[10px] mt-2 font-bold text-center"></p>
    </div>

    <!-- WATCH UPLOAD FORM WITH IMAGE LINKS -->
    <div class="bg-white p-6 rounded-2xl border border-[#e2dacb] shadow-sm">
        <h2 class="text-2xl font-black text-[#2b3a29] font-serif-title tracking-tight mb-1 text-center">TUE Watch Store</h2>
        <p class="text-xs text-[#5a6f56] text-center mb-6 font-semibold">Admin Panel - Add Products via Image Links</p>

        <form id="upload-form" class="space-y-4">
            <div>
                <label class="text-[11px] font-bold text-[#2b3a29] block mb-1">WATCH NAME</label>
                <input type="text" id="watch-name" placeholder="e.g. Rolex Datejust Olive Dial" required
                    class="w-full bg-[#fbf9f5] border border-[#dcd4c3] rounded-xl p-3 text-xs focus:border-[#2b3a29] outline-none text-[#1f2921]">
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="text-[11px] font-bold text-[#2b3a29] block mb-1">PRICE (PKR)</label>
                    <input type="number" id="watch-price" placeholder="3500" required
                        class="w-full bg-[#fbf9f5] border border-[#dcd4c3] rounded-xl p-3 text-xs focus:border-[#2b3a29] outline-none text-[#1f2921]">
                </div>
                <div>
                    <label class="text-[11px] font-bold text-[#2b3a29] block mb-1">INITIAL STOCK</label>
                    <input type="number" id="watch-stock" placeholder="10" required
                        class="w-full bg-[#fbf9f5] border border-[#dcd4c3] rounded-xl p-3 text-xs focus:border-[#2b3a29] outline-none text-[#1f2921]">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="text-[11px] font-bold text-[#2b3a29] block mb-1">COLOR NAMES</label>
                    <input type="text" id="watch-colors" placeholder="Silver, Black, Gold" required
                        class="w-full bg-[#fbf9f5] border border-[#dcd4c3] rounded-xl p-3 text-xs focus:border-[#2b3a29] outline-none text-[#1f2921]">
                </div>
                <div>
                    <label class="text-[11px] font-bold text-[#2b3a29] block mb-1">BADGE / TAG</label>
                    <select id="watch-tag" class="w-full bg-[#fbf9f5] border border-[#dcd4c3] rounded-xl p-3 text-xs focus:border-[#2b3a29] outline-none text-[#1f2921]">
                        <option value="">No Badge</option>
                        <option value="Top Selling">🔥 Top Selling</option>
                        <option value="Hot Item">⚡ Hot Item</option>
                        <option value="New Arrival">✨ New Arrival</option>
                        <option value="Limited Edition">💎 Limited Edition</option>
                        <option value="Special Sale">🏷️ Special Sale</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="text-[11px] font-bold text-[#2b3a29] block mb-1">IMAGE URL(S)</label>
                <textarea id="watch-urls" rows="3" placeholder="https://i.imgur.com/link1.jpg, https://i.imgur.com/link2.jpg" required
                    class="w-full bg-[#fbf9f5] border border-[#dcd4c3] rounded-xl p-3 text-xs focus:border-[#2b3a29] outline-none text-[#1f2921]"></textarea>
                <p class="text-[10px] text-[#5a6f56] mt-1 font-medium">Multiple photos ke liye URLs ke beech mein **comma ( , )** lagayein.</p>
            </div>

            <button type="submit" id="submit-btn" 
                class="w-full py-3.5 olive-btn rounded-xl uppercase text-xs tracking-wider transition-all">
                Publish Watch
            </button>
        </form>

        <div id="status-msg" class="mt-4 text-center text-xs font-bold"></div>
    </div>

    <!-- MANAGE INVENTORY SECTION -->
    <div class="bg-white p-6 rounded-2xl border border-[#e2dacb] shadow-sm">
        <div class="flex justify-between items-center mb-4">
            <h3 class="text-xs font-bold text-[#2b3a29] uppercase tracking-widest">📦 Manage Stock & Details</h3>
            <button id="btn-refresh-list" type="button" class="text-xs text-[#5a6f56] hover:underline font-bold">Reload</button>
        </div>

        <div id="watches-list" class="space-y-3">
            <p class="text-xs text-[#5a6f56] text-center">Fetching items...</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, doc, setDoc, getDoc, onSnapshot, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBdmv6OXxJt3VM-xybMMc0LrgFmv4AfjYg",
            authDomain: "tuewatchstore.firebaseapp.com",
            projectId: "tuewatchstore",
            appId: "1:982689793085:web:eb92ea1952692b083a5654"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Fetch Announcement
        const fetchAnnouncement = async () => {
            try {
                const docSnap = await getDoc(doc(db, "settings", "announcement"));
                if (docSnap.exists() && docSnap.data().text) {
                    document.getElementById('announcement-text').value = docSnap.data().text;
                }
            } catch (err) { console.error(err); }
        };
        fetchAnnouncement();

        // Banner Controls
        document.getElementById('btn-save-banner').addEventListener('click', async () => {
            const txt = document.getElementById('announcement-text').value.trim();
            const ancStatus = document.getElementById('anc-status');
            ancStatus.innerText = "⏳ Saving...";
            try {
                await setDoc(doc(db, "settings", "announcement"), { text: txt }, { merge: true });
                ancStatus.innerText = "✅ Banner Saved Live!";
                ancStatus.className = "text-[10px] mt-2 font-bold text-center text-emerald-700";
            } catch (err) { alert("Error: " + err.message); }
        });

        document.getElementById('btn-clear-banner').addEventListener('click', async () => {
            document.getElementById('announcement-text').value = "";
            await setDoc(doc(db, "settings", "announcement"), { text: "" }, { merge: true });
            document.getElementById('anc-status').innerText = "Banner Cleared!";
        });

        // Publish Watch
        document.getElementById('upload-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const status = document.getElementById('status-msg');
            const btn = document.getElementById('submit-btn');

            btn.disabled = true;
            status.innerText = "⏳ Publishing watch...";
            status.className = "text-[#2b3a29] text-center text-xs mt-4 font-bold";

            try {
                await addDoc(collection(db, "watches"), {
                    name: document.getElementById('watch-name').value.trim(),
                    price: Number(document.getElementById('watch-price').value),
                    stock: Number(document.getElementById('watch-stock').value),
                    sales: 0,
                    tag: document.getElementById('watch-tag').value || "",
                    url: document.getElementById('watch-urls').value.trim(),
                    colors: document.getElementById('watch-colors').value.trim()
                });

                alert("✅ Watch Published Successfully!");
                document.getElementById('upload-form').reset();
                status.innerText = "";
            } catch (err) {
                alert("Upload Error: " + err.message);
                status.innerText = "❌ Upload Failed!";
                status.className = "text-red-600 text-center text-xs mt-4 font-bold";
            } finally {
                btn.disabled = false;
            }
        });

        // Real-time Inventory List
        onSnapshot(collection(db, "watches"), (snapshot) => {
            const container = document.getElementById('watches-list');
            container.innerHTML = "";

            if (snapshot.empty) {
                container.innerHTML = `<p class="text-xs text-[#5a6f56] text-center py-4">No watches in catalog.</p>`;
                return;
            }

            snapshot.forEach((docSnap) => {
                const w = docSnap.data();
                const id = docSnap.id;
                
                let urls = w.url ? w.url.split(',').map(s => s.trim()) : [];
                const firstImg = urls[0] || 'https://via.placeholder.com/150?text=No+Image';

                const itemCard = document.createElement('div');
                itemCard.className = "bg-[#fbf9f5] border border-[#e2dacb] rounded-xl p-3 flex flex-col gap-3";
                itemCard.innerHTML = `
                    <div class="flex items-center gap-3">
                        <img src="${firstImg}" onerror="this.onerror=null;this.src='https://via.placeholder.com/150?text=Error';" class="w-14 h-14 object-cover rounded-lg border border-[#dcd4c3]">
                        <div class="flex-1 min-w-0">
                            <h4 class="text-xs font-bold text-[#2b3a29] truncate">${w.name}</h4>
                            <p class="text-[10px] text-[#5a6f56]">Colors: ${w.colors || 'N/A'}</p>
                            <p class="text-[9px] text-emerald-700 font-bold">${urls.length} Image Link(s)</p>
                        </div>
                        <button id="del-${id}" type="button" class="bg-red-50 hover:bg-red-100 border border-red-200 text-red-700 px-3 py-1.5 rounded-lg text-[10px] font-bold">
                            🗑️ Delete
                        </button>
                    </div>

                    <div class="space-y-2 bg-white p-2.5 rounded-lg border border-[#e2dacb]">
                        <div class="grid grid-cols-3 gap-2">
                            <div>
                                <label class="text-[9px] font-bold text-[#5a6f56] block mb-0.5">PRICE</label>
                                <input type="number" id="price-${id}" value="${w.price || 0}" class="w-full bg-[#fbf9f5] border border-[#dcd4c3] rounded p-1 text-xs text-[#1f2921]">
                            </div>
                            <div>
                                <label class="text-[9px] font-bold text-[#5a6f56] block mb-0.5">STOCK</label>
                                <input type="number" id="stock-${id}" value="${w.stock || 0}" class="w-full bg-[#fbf9f5] border border-[#dcd4c3] rounded p-1 text-xs text-[#1f2921]">
                            </div>
                            <div>
                                <label class="text-[9px] font-bold text-[#5a6f56] block mb-0.5">TAG</label>
                                <select id="tag-${id}" class="w-full bg-[#fbf9f5] border border-[#dcd4c3] rounded p-1 text-[10px] text-[#1f2921]">
                                    <option value="" ${!w.tag ? 'selected' : ''}>None</option>
                                    <option value="Top Selling" ${w.tag === 'Top Selling' ? 'selected' : ''}>Top Selling</option>
                                    <option value="Hot Item" ${w.tag === 'Hot Item' ? 'selected' : ''}>Hot Item</option>
                                    <option value="New Arrival" ${w.tag === 'New Arrival' ? 'selected' : ''}>New Arrival</option>
                                    <option value="Limited Edition" ${w.tag === 'Limited Edition' ? 'selected' : ''}>Limited Edition</option>
                                    <option value="Special Sale" ${w.tag === 'Special Sale' ? 'selected' : ''}>Special Sale</option>
                                </select>
                            </div>
                        </div>

                        <div>
                            <label class="text-[9px] font-bold text-[#5a6f56] block mb-0.5">IMAGE URL(S)</label>
                            <input type="text" id="url-${id}" value="${w.url || ''}" class="w-full bg-[#fbf9f5] border border-[#dcd4c3] rounded p-1.5 text-xs text-[#1f2921]">
                        </div>
                    </div>

                    <button id="update-${id}" type="button" class="w-full py-2 bg-white border border-[#2b3a29] text-[#2b3a29] hover:bg-[#2b3a29] hover:text-white rounded-lg text-[10px] font-bold uppercase tracking-wider transition-all">
                        Save Updates
                    </button>
                `;

                container.appendChild(itemCard);

                document.getElementById(`update-${id}`).addEventListener('click', async () => {
                    try {
                        await updateDoc(doc(db, "watches", id), {
                            price: Number(document.getElementById(`price-${id}`).value),
                            stock: Number(document.getElementById(`stock-${id}`).value),
                            tag: document.getElementById(`tag-${id}`).value,
                            url: document.getElementById(`url-${id}`).value.trim()
                        });
                        alert("✅ Updated details for " + w.name);
                    } catch (err) { alert(err.message); }
                });

                document.getElementById(`del-${id}`).addEventListener('click', async () => {
                    if (confirm(`Delete "${w.name}"?`)) {
                        try {
                            await deleteDoc(doc(db, "watches", id));
                            alert("🗑️ Item Deleted!");
                        } catch (err) { alert(err.message); }
                    }
                });
            });
        });

        document.getElementById('btn-refresh-list').addEventListener('click', () => location.reload());
    </script>
</body>
</html>
