<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Lab - Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        ::selection {
            background-color: #d4af37;
            color: #000000;
        }

        body {
            background-color: #0f0f0f;
            color: #f3f4f6;
            padding: 20px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 1px solid #262626;
            padding-bottom: 15px;
        }

        .logo { font-size: 20px; font-weight: 700; color: #d4af37; }
        .back-link { color: #d4af37; text-decoration: none; font-size: 13px; font-weight: 500; }

        .card-box {
            background: #161616;
            border: 1px solid #262626;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 15px;
            font-weight: 600;
            color: #d4af37;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; color: #9ca3af; margin-bottom: 6px; }

        .form-control {
            width: 100%;
            padding: 10px 12px;
            background: #222;
            border: 1px solid #333;
            color: white;
            border-radius: 8px;
            font-size: 13px;
            outline: none;
        }

        .form-control:focus { border-color: #d4af37; }

        .submit-btn {
            width: 100%;
            background-color: #d4af37;
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .manage-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1f1f1f;
            border: 1px solid #2e2e2e;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .manage-info { display: flex; align-items: center; gap: 10px; }
        .manage-info img { width: 40px; height: 40px; object-fit: cover; border-radius: 6px; }
        .manage-details h5 { font-size: 12px; color: #fff; }
        .manage-details p { font-size: 11px; color: #d4af37; }

        .manage-actions { display: flex; gap: 6px; }
        .action-btn {
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 11px;
            font-weight: 600;
            border: none;
            cursor: pointer;
        }
        .edit-btn { background: #3b82f6; color: #fff; }
        .delete-btn { background: #ef4444; color: #fff; }
        .sold-btn { background: #eab308; color: #000; }
    </style>
</head>
<body>

    <div class="header-top">
        <div class="logo">Time Lab | Admin Panel</div>
        <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> View Website</a>
    </div>

    <!-- 1. Delivery Charges -->
    <div class="card-box" style="border-color: #d4af37;">
        <div class="section-title"><i class="fa-solid fa-truck-fast"></i> Manage Delivery Charges</div>
        <form id="deliveryFeeForm">
            <div class="form-group">
                <label>Current Delivery Fee (Rs.)</label>
                <input type="number" id="deliveryFeeInput" class="form-control" required>
            </div>
            <button type="submit" class="submit-btn">Update Delivery Charges</button>
        </form>
    </div>

    <!-- 2. Add Model / Lookbook Image -->
    <div class="card-box">
        <div class="section-title"><i class="fa-solid fa-camera"></i> Add Lookbook Model / Card</div>
        <form id="modelForm">
            <div class="form-group">
                <label>Model / Card Title</label>
                <input type="text" id="modelTitle" class="form-control" placeholder="e.g., Classic Look" required>
            </div>
            <div class="form-group">
                <label>Image URL</label>
                <input type="url" id="modelUrl" class="form-control" placeholder="https://..." required>
            </div>
            <button type="submit" class="submit-btn">Add Model to Lookbook</button>
        </form>
    </div>

    <!-- Lookbook Management List (Delete Models) -->
    <div class="card-box">
        <div class="section-title"><i class="fa-solid fa-list-check"></i> Manage Lookbook Models</div>
        <div id="adminModelList">Loading models...</div>
    </div>

    <!-- 3. Add or Edit Watch Product Form -->
    <div class="card-box">
        <div class="section-title" id="formTitleHeading"><i class="fa-solid fa-clock"></i> Add New Watch Product</div>
        <form id="watchForm">
            <input type="hidden" id="editWatchId">
            <div class="form-group">
                <label>Watch Name</label>
                <input type="text" id="watchName" class="form-control" placeholder="e.g., Ultra Smart Series 9" required>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div class="form-group">
                    <label>Category</label>
                    <select id="watchCategory" class="form-control">
                        <option value="Hot Selling">🔥 Hot Selling</option>
                        <option value="Smart Watch">⌚ Smart Watch</option>
                        <option value="New Arrival">New Arrival</option>
                        <option value="Regular">Regular</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Strap Type</label>
                    <select id="watchStrap" class="form-control">
                        <option value="Leather Strap">Leather Strap</option>
                        <option value="Chain Strap">Chain Strap</option>
                        <option value="Silicon Strap">Silicon Strap</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>Price (Rs.)</label>
                <input type="number" id="watchPrice" class="form-control" placeholder="e.g., 5000" required>
            </div>

            <div class="form-group">
                <label>Watch Photo URL</label>
                <input type="url" id="watchUrlInput" class="form-control" placeholder="https://..." required>
            </div>

            <button type="submit" class="submit-btn" id="saveWatchBtn">Publish Watch to Store</button>
        </form>
    </div>

    <!-- Existing Watches List (Edit / Delete / Sold Out) -->
    <div class="card-box">
        <div class="section-title"><i class="fa-solid fa-list-check"></i> Manage Watches (Edit / Delete / Sold Out)</div>
        <div id="adminWatchList">Loading watches...</div>
    </div>

    <script>
        window.addEventListener("DOMContentLoaded", () => {
            document.getElementById("deliveryFeeInput").value = localStorage.getItem("timelab_delivery_fee") || "400";
            renderAdminModels();
            renderAdminWatches();
        });

        document.getElementById("deliveryFeeForm").addEventListener("submit", function(e) {
            e.preventDefault();
            const fee = document.getElementById("deliveryFeeInput").value;
            localStorage.setItem("timelab_delivery_fee", fee);
            alert("Delivery Charges Updated Successfully!");
        });

        // Model / Lookbook Functions
        document.getElementById("modelForm").addEventListener("submit", function(e) {
            e.preventDefault();
            const title = document.getElementById("modelTitle").value;
            const image = document.getElementById("modelUrl").value;

            let models = JSON.parse(localStorage.getItem("timelab_models")) || [];
            models.push({ id: Date.now(), title, image });
            localStorage.setItem("timelab_models", JSON.stringify(models));

            alert("Lookbook Model Added Successfully!");
            this.reset();
            renderAdminModels();
        });

        function renderAdminModels() {
            const container = document.getElementById("adminModelList");
            container.innerHTML = "";
            let models = JSON.parse(localStorage.getItem("timelab_models")) || [];

            if (models.length === 0) {
                container.innerHTML = `<p style="color: #737373; font-size: 12px;">No lookbook models added yet.</p>`;
                return;
            }

            models.forEach(m => {
                container.innerHTML += `
                    <div class="manage-item">
                        <div class="manage-info">
                            <img src="${m.image}" alt="">
                            <div class="manage-details">
                                <h5>${m.title}</h5>
                            </div>
                        </div>
                        <div class="manage-actions">
                            <button class="action-btn delete-btn" onclick="deleteModel(${m.id})">Delete</button>
                        </div>
                    </div>
                `;
            });
        }

        function deleteModel(id) {
            if (confirm("Delete this lookbook model?")) {
                let models = JSON.parse(localStorage.getItem("timelab_models")) || [];
                models = models.filter(m => m.id !== id);
                localStorage.setItem("timelab_models", JSON.stringify(models));
                renderAdminModels();
                alert("Model Deleted Successfully!");
            }
        }

        // Watch Functions
        function getStoredWatches() {
            return JSON.parse(localStorage.getItem("timelab_watches")) || [];
        }

        function renderAdminWatches() {
            const listContainer = document.getElementById("adminWatchList");
            listContainer.innerHTML = "";
            let watches = getStoredWatches();

            if (watches.length === 0) {
                listContainer.innerHTML = `<p style="color: #737373; font-size: 12px;">No watches uploaded yet.</p>`;
                return;
            }

            watches.forEach(watch => {
                let statusText = watch.status === "soldout" ? "🟢 Available" : "🟡 Sold Out";
                listContainer.innerHTML += `
                    <div class="manage-item">
                        <div class="manage-info">
                            <img src="${watch.image}" alt="">
                            <div class="manage-details">
                                <h5>${watch.name}</h5>
                                <p>Rs. ${watch.price} | ${watch.category} ${watch.status === 'soldout' ? '<b>(SOLD OUT)</b>' : ''}</p>
                            </div>
                        </div>
                        <div class="manage-actions">
                            <button class="action-btn sold-btn" onclick="toggleSoldOut(${watch.id})">${statusText}</button>
                            <button class="action-btn edit-btn" onclick="editWatch(${watch.id})">Edit</button>
                            <button class="action-btn delete-btn" onclick="deleteWatch(${watch.id})">Delete</button>
                        </div>
                    </div>
                `;
            });
        }

        document.getElementById("watchForm").addEventListener("submit", function(e) {
            e.preventDefault();
            let watches = getStoredWatches();
            const editId = document.getElementById("editWatchId").value;

            const name = document.getElementById("watchName").value;
            const category = document.getElementById("watchCategory").value;
            const strap = document.getElementById("watchStrap").value;
            const price = document.getElementById("watchPrice").value;
            const image = document.getElementById("watchUrlInput").value;

            if (editId) {
                let index = watches.findIndex(w => w.id == editId);
                if (index !== -1) {
                    watches[index].name = name;
                    watches[index].category = category;
                    watches[index].strap = strap;
                    watches[index].price = price;
                    watches[index].image = image;
                }
                alert("Watch Updated Successfully!");
                document.getElementById("editWatchId").value = "";
                document.getElementById("formTitleHeading").innerHTML = `<i class="fa-solid fa-clock"></i> Add New Watch Product`;
                document.getElementById("saveWatchBtn").innerText = "Publish Watch to Store";
            } else {
                const newWatch = {
                    id: Date.now(),
                    name, category, strap, price, image,
                    status: "available"
                };
                watches.push(newWatch);
                alert("Watch Published Successfully!");
            }

            localStorage.setItem("timelab_watches", JSON.stringify(watches));
            this.reset();
            renderAdminWatches();
        });

        function editWatch(id) {
            let watches = getStoredWatches();
            let watch = watches.find(w => w.id === id);
            if (!watch) return;

            document.getElementById("editWatchId").value = watch.id;
            document.getElementById("watchName").value = watch.name;
            document.getElementById("watchCategory").value = watch.category;
            document.getElementById("watchStrap").value = watch.strap;
            document.getElementById("watchPrice").value = watch.price;
            document.getElementById("watchUrlInput").value = watch.image;

            document.getElementById("formTitleHeading").innerHTML = `<i class="fa-solid fa-pen-to-square"></i> Edit Watch Product`;
            document.getElementById("saveWatchBtn").innerText = "Update Watch Changes";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function deleteWatch(id) {
            if (confirm("Are you sure you want to delete this watch?")) {
                let watches = getStoredWatches();
                watches = watches.filter(w => w.id !== id);
                localStorage.setItem("timelab_watches", JSON.stringify(watches));
                renderAdminWatches();
                alert("Watch Deleted Successfully!");
            }
        }

        function toggleSoldOut(id) {
            let watches = getStoredWatches();
            let watch = watches.find(w => w.id === id);
            if (watch) {
                watch.status = watch.status === "soldout" ? "available" : "soldout";
                localStorage.setItem("timelab_watches", JSON.stringify(watches));
                renderAdminWatches();
            }
        }
    </script>
</body>
</html>
