<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TUE WATCHES | Exclusive Timepieces</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            background-color: #fbf9f5; 
            color: #1f2921; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
        }
        .font-serif-title {
            font-family: 'Playfair Display', serif;
        }
        .olive-btn {
            background: linear-gradient(135deg, #2b3a29 0%, #3d523a 100%);
            color: #fcfaf7;
        }
        .olive-btn:hover {
            background: linear-gradient(135deg, #202b1f 0%, #2e3e2c 100%);
        }
        .cream-card {
            background: #ffffff;
            border: 1px solid #e8e2d5;
            box-shadow: 0 4px 20px -2px rgba(43, 58, 41, 0.05);
            transition: all 0.35s ease;
        }
        .cream-card:hover {
            transform: translateY(-6px);
            border-color: #c5a059;
            box-shadow: 0 16px 30px -10px rgba(43, 58, 41, 0.12);
        }
        .announcement-bar { 
            background-color: #2b3a29; 
            border-bottom: 1px solid #c5a059;
            color: #f4efe6; 
            word-break: break-word;
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col justify-between">

    <!-- Top Announcement Bar -->
    <div id="announcement-section" class="announcement-bar text-center py-2.5 px-4 font-medium text-xs hidden tracking-widest uppercase sticky top-0 z-[9999] shadow-sm"></div>

    <!-- Store Header -->
    <header class="py-14 px-6 text-center bg-[#f4efe6] border-b border-[#e5decb] relative">
        <div class="max-w-2xl mx-auto">
            <span class="text-[10px] font-bold tracking-[0.3em] text-[#3a4d38] uppercase bg-[#e3dbc8] px-3.5 py-1 rounded-full border border-[#d2c7ae]">Official Showroom</span>
            <h1 class="text-4xl sm:text-5xl font-extrabold tracking-tight font-serif-title text-[#2b3a29] italic mt-4 mb-2">TUE WATCHES</h1>
            <p class="text-[#5a6f56] text-xs sm:text-sm tracking-[0.25em] font-semibold uppercase">Timeless Elegance & Pure Style</p>
        </div>
    </header>

    <!-- Main Inventory Grid -->
    <main class="container mx-auto px-4 sm:px-6 py-12 flex-grow">
        <div id="watch-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
            <div class="animate-pulse text-[#5a6f56] text-center col-span-full py-24 space-y-3">
                <div class="w-8 h-8 border-2 border-[#3a4d38] border-t-transparent rounded-full animate-spin mx-auto"></div>
                <p class="tracking-widest uppercase text-xs font-semibold">Loading Collection...</p>
            </div>
        </div>
    </main>

    <!-- Variants Color Selection Modal -->
    <div id="color-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[10000] hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-[#fbf9f5] border border-[#e2dacb] w-full max-w-lg rounded-t-3xl sm:rounded-3xl p-6 relative max-h-[85vh] overflow-y-auto shadow-2xl">
            <button id="close-modal-btn" type="button" class="absolute top-4 right-4 bg-[#e8e2d5] hover:bg-[#dcd4c3] text-[#2b3a29] w-8 h-8 rounded-full font-bold text-xs flex items-center justify-center transition-all">✕</button>
            <h3 id="modal-watch-name" class="text-xl font-bold mb-1 text-[#2b3a29] font-serif-title"></h3>
            <p class="text-xs text-[#5a6f56] font-medium mb-5">Select your preferred color variant:</p>
            
            <div id="modal-variants-list" class="space-y-3"></div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="py-8 px-6 text-center border-t border-[#e8e2d5] text-[#6b7c67] bg-[#f4efe6]">
        <p class="text-[11px] tracking-widest uppercase font-semibold">&copy; 2026 TUE WATCHES &bull; Baldia 4 Market, Karachi</p>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBdmv6OXxJt3VM-xybMMc0LrgFmv4AfjYg",
            authDomain: "tuewatchstore.firebaseapp.com",
            projectId: "tuewatchstore",
            appId: "1:982689793085:web:eb92ea1952692b083a5654"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.watchStore = {};

        document.getElementById('close-modal-btn').addEventListener('click', () => {
            document.getElementById('color-modal').classList.add('hidden');
        });

        // Real-time Announcement Observer
        onSnapshot(doc(db, "settings", "announcement"), (docSnap) => {
            const bar = document.getElementById('announcement-section');
            if (docSnap.exists() && docSnap.data().text && docSnap.data().text.trim() !== "") {
                bar.textContent = docSnap.data().text;
                bar.classList.remove('hidden');
            } else {
                bar.textContent = "";
                bar.classList.add('hidden');
            }
        });

        // Real-time Watches Observer
        onSnapshot(collection(db, "watches"), (snapshot) => {
            const list = document.getElementById('watch-list');
            list.innerHTML = "";

            if (snapshot.empty) {
                list.innerHTML = "<p class='col-span-full text-center text-[#6b7c67] py-16 text-sm font-medium'>No watches available in catalog right now.</p>";
                return;
            }

            snapshot.forEach((docSnap) => {
                const docId = docSnap.id;
                const w = docSnap.data();
                
                const urls = w.url ? w.url.split(',').map(s => s.trim()) : [];
                const colors = w.colors ? w.colors.split(',').map(s => s.trim()) : [];

                window.watchStore[docId] = { ...w, urls, colors };

                const currentStock = (w.stock || 0) - (w.sales || 0);
                const isOutOfStock = currentStock <= 0;
                const mainImg = urls[0] || 'https://via.placeholder.com/400x500?text=TUE+Watches';

                const tagBadgeHtml = w.tag ? `<span class="absolute top-3 left-3 bg-[#2b3a29] text-[#f4efe6] text-[10px] font-bold uppercase px-3 py-1 rounded-full shadow-md z-10 tracking-wider border border-[#c5a059]">✨ ${w.tag}</span>` : '';

                const defaultMsg = `Salam TUE Watches!\nI would like to order:\n\n*Watch:* ${w.name}\n*Price:* Rs. ${Number(w.price).toLocaleString()}\n*Image:* ${mainImg}`;
                const defaultWaLink = `https://wa.me/923232124734?text=${encodeURIComponent(defaultMsg)}`;

                const card = document.createElement('div');
                card.className = "cream-card p-4 rounded-2xl group relative flex flex-col justify-between";
                card.innerHTML = `
                    <div>
                        <div class="relative overflow-hidden rounded-xl mb-4 bg-[#f4efe6] aspect-[4/5]">
                            ${tagBadgeHtml}
                            <img src="${mainImg}" class="w-full h-full object-cover transition-transform duration-500 ease-out group-hover:scale-105">
                            ${isOutOfStock ? '<div class="absolute inset-0 bg-white/85 backdrop-blur-sm flex items-center justify-center font-bold uppercase tracking-widest text-sm text-red-600 z-20">Sold Out</div>' : ''}
                        </div>
                        
                        <div class="px-1">
                            <h3 class="text-lg font-extrabold mb-1 tracking-tight text-[#2b3a29] font-serif-title">${w.name}</h3>
                            
                            <div class="flex justify-between items-baseline mb-4">
                                <p class="text-[#2b3a29] font-extrabold text-xl">PKR ${Number(w.price).toLocaleString()}</p>
                                <p class="text-[11px] uppercase tracking-wider ${isOutOfStock ? 'text-red-600' : 'text-[#3a4d38]'} font-bold">
                                    ${isOutOfStock ? 'Out of Stock' : `In Stock: ${currentStock}`}
                                </p>
                            </div>
                        </div>
                    </div>

                    <div class="space-y-2 mt-2">
                        ${urls.length > 1 ? `
                            <button id="btn-colors-${docId}" type="button" 
                                class="w-full py-2.5 px-4 rounded-xl border border-[#d8d0be] bg-[#f4efe6] hover:bg-[#eae2d0] text-[#2b3a29] text-xs font-semibold flex items-center justify-between transition-all">
                                <span>See Available Colors</span>
                                <span class="text-[10px] bg-[#2b3a29] text-[#f4efe6] px-2 py-0.5 rounded-full font-bold">${urls.length} Colors</span>
                            </button>
                        ` : ''}

                        <a href="${isOutOfStock ? '#' : defaultWaLink}" target="_blank" 
                            class="block text-center w-full ${isOutOfStock ? 'bg-gray-200 cursor-not-allowed text-gray-500' : 'olive-btn'} py-3 rounded-xl font-bold text-xs uppercase tracking-wider transition-all shadow-md">
                            ${isOutOfStock ? 'Sold Out' : 'Order via WhatsApp'}
                        </a>
                    </div>
                `;

                list.appendChild(card);

                if (urls.length > 1) {
                    document.getElementById(`btn-colors-${docId}`).addEventListener('click', () => {
                        document.getElementById('modal-watch-name').innerText = w.name;
                        const modalContainer = document.getElementById('modal-variants-list');
                        modalContainer.innerHTML = "";

                        urls.forEach((url, idx) => {
                            const colorName = colors[idx] || `Option ${idx + 1}`;
                            const msg = `Salam TUE Watches!\nI would like to order:\n\n*Watch:* ${w.name}\n*Selected Variant:* ${colorName}\n*Price:* Rs. ${Number(w.price).toLocaleString()}\n*Image:* ${url}`;
                            const waUrl = `https://wa.me/923232124734?text=${encodeURIComponent(msg)}`;

                            modalContainer.innerHTML += `
                                <div class="p-3 bg-white rounded-xl border border-[#e2dacb] flex items-center gap-4 shadow-sm">
                                    <img src="${url}" class="w-16 h-16 object-cover rounded-lg border border-[#e8e2d5]">
                                    <div class="flex-1 min-w-0">
                                        <h4 class="font-bold text-xs text-[#2b3a29] truncate">${colorName}</h4>
                                        <p class="text-[#3a4d38] font-extrabold text-xs mt-0.5">PKR ${Number(w.price).toLocaleString()}</p>
                                    </div>
                                    <a href="${waUrl}" target="_blank" 
                                       class="olive-btn font-bold text-[11px] px-3.5 py-2.5 rounded-xl uppercase tracking-wider transition-all">
                                        Order
                                    </a>
                                </div>
                            `;
                        });

                        document.getElementById('color-modal').classList.remove('hidden');
                    });
                }
            });
        });
    </script>
</body>
</html>
