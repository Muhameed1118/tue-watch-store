<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TUE | Official Watch Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { background: #fbf9f5; color: #1f2921; font-family: 'Plus Jakarta Sans', sans-serif; display: flex; flex-direction: column; min-height: 100vh; }
        .olive-btn { background: #2b3a29; color: #fcfaf7; font-weight: 700; }
        .olive-btn:hover { background: #1e2a1c; }
        .font-serif-title { font-family: 'Playfair Display', serif; }
        .badge-tag { background: #2b3a29; color: #ffffff; font-weight: 700; font-size: 10px; padding: 3px 8px; border-radius: 6px; }
        .color-chip { border: 1px solid #dcd4c3; background: #ffffff; padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 600; color: #2b3a29; cursor: pointer; transition: all 0.2s; }
        .color-chip.active { background: #2b3a29; color: #ffffff; border-color: #2b3a29; }
        .active-thumb { border: 2px solid #2b3a29 !important; opacity: 1 !important; }

        /* Watch Card Hover Effect */
        .watch-card {
            transition: all 0.3s ease;
        }
        .watch-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 24px -10px rgba(43, 58, 41, 0.18);
        }

        /* Continuous Scrolling Banner Animation */
        .marquee-container {
            overflow: hidden;
            white-space: nowrap;
        }
        .marquee-content {
            display: inline-block;
            padding-left: 100%;
            animation: marquee 18s linear infinite;
        }
        @keyframes marquee {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-100%, 0); }
        }
    </style>
</head>
<body class="antialiased">

    <!-- MOVING ANNOUNCEMENT BANNER -->
    <div id="announcement-bar" class="hidden bg-[#2b3a29] text-[#fcfaf7] text-xs py-2 px-4 shadow-sm marquee-container font-semibold tracking-wide">
        <span id="announcement-content" class="marquee-content"></span>
    </div>

    <!-- HEADER / BRANDING -->
    <header class="py-6 px-4 text-center bg-white border-b border-[#e2dacb] shadow-xs sticky top-0 z-40">
        <h1 class="text-3xl font-black text-[#2b3a29] font-serif-title tracking-tight">TUE</h1>
        <p class="text-[10px] uppercase tracking-widest text-[#5a6f56] font-bold mt-0.5">Premium Timepieces • Since 2026</p>
    </header>

    <!-- MAIN SECTION WITH SEARCH BAR -->
    <main class="flex-grow max-w-4xl w-full mx-auto p-4 sm:p-6">
        
        <!-- SEARCH BAR -->
        <div class="mb-6">
            <div class="relative max-w-md mx-auto">
                <input type="text" id="search-input" placeholder="Search watch by name..." 
                       class="w-full bg-white border border-[#e2dacb] rounded-2xl py-3 px-4 pl-11 text-xs text-[#2b3a29] placeholder-[#8c9c8a] focus:outline-none focus:border-[#2b3a29] shadow-xs transition-all">
                <svg class="w-4 h-4 text-[#5a6f56] absolute left-4 top-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
            </div>
        </div>

        <!-- CATALOG GRID -->
        <div id="catalog-container" class="grid grid-cols-1 sm:grid-cols-2 gap-6">
            <p class="text-xs text-[#5a6f56] text-center col-span-full py-10">Loading watches...</p>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-white border-t border-[#e2dacb] py-8 px-4 text-center mt-12">
        <div class="max-w-4xl mx-auto flex flex-col items-center gap-2">
            <h2 class="text-lg font-black font-serif-title text-[#2b3a29]">TUE Watches</h2>
            <p class="text-xs text-[#5a6f56]">Crafting elegance, defining moments. Elevate your everyday style with our timeless collection.</p>
            <p class="text-[11px] font-semibold text-[#2b3a29] mt-2">&copy; 2026 TUE Watch Store. All rights reserved.</p>
        </div>
    </footer>

    <!-- FLOATING WHATSAPP HELP BUTTON -->
    <a href="https://wa.me/9232124734?text=Hello%20TUE%20Watch%20Store!%20I%20need%20some%20help." target="_blank" 
       class="fixed bottom-6 right-6 z-50 bg-[#25D366] text-white p-3.5 rounded-full shadow-lg hover:scale-110 transition-all flex items-center justify-center gap-2 font-bold text-xs">
        <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24">
            <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/>
        </svg>
        <span class="hidden sm:inline">Need Help?</span>
    </a>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBdmv6OXxJt3VM-xybMMc0LrgFmv4AfjYg",
            authDomain: "tuewatchstore.firebaseapp.com",
            projectId: "tuewatchstore",
            appId: "1:982689793085:web:eb92ea1952692b083a5654"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Fetch Live Moving Announcement Banner
        const loadBanner = async () => {
            try {
                const docSnap = await getDoc(doc(db, "settings", "announcement"));
                if (docSnap.exists() && docSnap.data().text) {
                    document.getElementById('announcement-content').innerText = docSnap.data().text;
                    document.getElementById('announcement-bar').classList.remove('hidden');
                }
            } catch(e) { console.error(e); }
        };
        loadBanner();

        let allWatches = [];

        // Render Real-time Watches Catalog
        onSnapshot(collection(db, "watches"), (snapshot) => {
            allWatches = [];
            snapshot.forEach((docSnap) => {
                allWatches.push({ id: docSnap.id, ...docSnap.data() });
            });
            renderWatches(allWatches);
        });

        // Function to render watches list with search filter support
        function renderWatches(watchesToRender) {
            const container = document.getElementById('catalog-container');
            container.innerHTML = "";

            if (watchesToRender.length === 0) {
                container.innerHTML = `<p class="text-xs text-[#5a6f56] text-center col-span-full py-10">No watches found.</p>`;
                return;
            }

            watchesToRender.forEach((w) => {
                const id = w.id;

                // Extract Image URLs
                let urls = [];
                if (w.url) {
                    urls = w.url.includes('---SPLIT---') 
                           ? w.url.split('---SPLIT---').map(u => u.trim()) 
                           : w.url.split(',').map(u => u.trim());
                }
                urls = urls.filter(u => u.length > 0);
                const mainImg = urls[0] || 'https://via.placeholder.com/400?text=No+Image';

                // Extract Colors
                let colorsList = [];
                if (w.colors) {
                    colorsList = w.colors.split(',').map(c => c.trim()).filter(c => c.length > 0);
                }

                const card = document.createElement('div');
                card.className = "watch-card bg-white rounded-2xl border border-[#e2dacb] overflow-hidden shadow-sm flex flex-col justify-between";

                // Gallery Thumbnails HTML
                let thumbsHtml = "";
                if (urls.length > 1) {
                    thumbsHtml = `<div class="flex gap-2 p-2 bg-[#fbf9f5] border-t border-[#e2dacb] overflow-x-auto">`;
                    urls.forEach((u, idx) => {
                        thumbsHtml += `
                            <img src="${u}" 
                                 class="thumb-btn-${id} ${idx === 0 ? 'active-thumb' : 'opacity-70'}" 
                                 data-url="${u}" 
                                 style="width:44px; height:44px; object-fit:cover; border-radius:8px; cursor:pointer; border:2px solid transparent;"
                            >
                        `;
                    });
                    thumbsHtml += `</div>`;
                }

                // Color Chips HTML
                let colorsHtml = "";
                if (colorsList.length > 0) {
                    colorsHtml = `<div class="mt-3">
                        <label class="text-[10px] font-bold text-[#5a6f56] block mb-1.5 uppercase tracking-wider">Available Colors:</label>
                        <div class="flex flex-wrap gap-1.5" id="colors-group-${id}">`;
                    colorsList.forEach((col, idx) => {
                        colorsHtml += `<button type="button" class="color-chip ${idx === 0 ? 'active' : ''}" data-color="${col}">${col}</button>`;
                    });
                    colorsHtml += `</div></div>`;
                }

                card.innerHTML = `
                    <div>
                        <!-- Main Watch Image -->
                        <div class="relative bg-[#fbf9f5] aspect-square flex items-center justify-center overflow-hidden">
                            <img id="main-img-${id}" src="${mainImg}" onerror="this.onerror=null;this.src='https://via.placeholder.com/400?text=Image+Error';" class="w-full h-full object-cover transition-all duration-300">
                            ${w.tag ? `<span class="absolute top-3 left-3 badge-tag">${w.tag}</span>` : ''}
                        </div>
                        
                        ${thumbsHtml}

                        <div class="p-4">
                            <h3 class="text-base font-bold text-[#2b3a29] leading-tight">${w.name}</h3>
                            
                            <div class="flex items-center justify-between mt-2">
                                <span class="text-lg font-black text-[#2b3a29]">Rs. ${Number(w.price).toLocaleString()}</span>
                            </div>

                            ${colorsHtml}
                        </div>
                    </div>

                    <div class="p-4 pt-0">
                        <button type="button" id="buy-btn-${id}" 
                                class="w-full py-3 olive-btn rounded-xl uppercase text-xs tracking-wider flex items-center justify-center gap-2 shadow-xs transition-all">
                            💬 Order on WhatsApp
                        </button>
                    </div>
                `;

                container.appendChild(card);

                // Image Switching Click Handler
                const thumbImgs = card.querySelectorAll(`.thumb-btn-${id}`);
                thumbImgs.forEach(imgEl => {
                    imgEl.addEventListener('click', () => {
                        const targetUrl = imgEl.getAttribute('data-url');
                        document.getElementById(`main-img-${id}`).src = targetUrl;
                        thumbImgs.forEach(t => {
                            t.classList.remove('active-thumb');
                            t.classList.add('opacity-70');
                        });
                        imgEl.classList.add('active-thumb');
                        imgEl.classList.remove('opacity-70');
                    });
                });

                // Color Selection Handler
                const colorBtns = card.querySelectorAll(`#colors-group-${id} .color-chip`);
                colorBtns.forEach(btn => {
                    btn.addEventListener('click', () => {
                        colorBtns.forEach(c => c.classList.remove('active'));
                        btn.classList.add('active');
                    });
                });

                // WhatsApp Order Handler with Correct Number
                document.getElementById(`buy-btn-${id}`).addEventListener('click', () => {
                    const activeColor = card.querySelector(`#colors-group-${id} .active`)?.getAttribute('data-color') || 'Standard';
                    const phoneNumber = "9232124734"; // Correct updated store owner number
                    const message = `Hello TUE Watch Store! I would like to order:\n\n*Watch:* ${w.name}\n*Price:* Rs. ${Number(w.price).toLocaleString()}\n*Selected Color:* ${activeColor}\n\nPlease confirm availability.`;
                    window.open(`https://wa.me/${phoneNumber}?text=${encodeURIComponent(message)}`, '_blank');
                });
            });
        }

        // Search Bar Event Listener
        document.getElementById('search-input').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            const filtered = allWatches.filter(w => w.name && w.name.toLowerCase().includes(query));
            renderWatches(filtered);
        });
    </script>
</body>
</html>
