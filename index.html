<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TUE | Official Watch Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { background: #fbf9f5; color: #1f2921; font-family: 'Plus Jakarta Sans', sans-serif; }
        .olive-btn { background: #2b3a29; color: #fcfaf7; font-weight: 700; }
        .olive-btn:hover { background: #1e2a1c; }
        .font-serif-title { font-family: 'Playfair Display', serif; }
        .badge-tag { background: #2b3a29; color: #ffffff; font-weight: 700; font-size: 10px; padding: 3px 8px; border-radius: 6px; }
        .color-chip { border: 1px solid #dcd4c3; background: #ffffff; padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 600; color: #2b3a29; cursor: pointer; transition: all 0.2s; }
        .color-chip.active { background: #2b3a29; color: #ffffff; border-color: #2b3a29; }
        .thumb-img { width: 42px; height: 42px; border-radius: 8px; border: 2px solid transparent; cursor: pointer; object-fit: cover; }
        .thumb-img.active-thumb { border-color: #2b3a29; }
    </style>
</head>
<body class="pb-24 antialiased">

    <!-- ANNOUNCEMENT BANNER -->
    <div id="announcement-bar" class="hidden bg-[#2b3a29] text-[#fcfaf7] text-xs py-2 px-4 text-center font-semibold tracking-wide shadow-sm">
        <span id="announcement-content"></span>
    </div>

    <!-- HEADER / BRANDING -->
    <header class="py-6 px-4 text-center bg-white border-b border-[#e2dacb] shadow-xs sticky top-0 z-40">
        <h1 class="text-3xl font-black text-[#2b3a29] font-serif-title tracking-tight">TUE</h1>
        <p class="text-[10px] uppercase tracking-widest text-[#5a6f56] font-bold mt-0.5">Premium Timepieces • Since 2026</p>
    </header>

    <!-- CATALOG GRID -->
    <main class="max-w-4xl mx-auto p-4 sm:p-6">
        <div id="catalog-container" class="grid grid-cols-1 sm:grid-cols-2 gap-6">
            <p class="text-xs text-[#5a6f56] text-center col-span-full py-10">Loading watches...</p>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBdmv6OXxJt3VM-xybMMc0LrgFmv4AfjYg",
            authDomain: "tuewatchstore.firebaseapp.com",
            projectId: "tuewatchstore",
            appId: "1:982689793085:web:eb92ea1952692b083a5654"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Fetch Live Announcement Banner
        const loadBanner = async () => {
            try {
                const docSnap = await getDoc(doc(db, "settings", "announcement"));
                if (docSnap.exists() && docSnap.data().text) {
                    document.getElementById('announcement-content').innerText = docSnap.data().text;
                    document.getElementById('announcement-bar').classList.remove('hidden');
                }
            } catch(e) { console.error(e); }
        };
        loadBanner();

        // Render Real-time Watches Catalog
        onSnapshot(collection(db, "watches"), (snapshot) => {
            const container = document.getElementById('catalog-container');
            container.innerHTML = "";

            if (snapshot.empty) {
                container.innerHTML = `<p class="text-xs text-[#5a6f56] text-center col-span-full py-10">No watches currently available.</p>`;
                return;
            }

            snapshot.forEach((docSnap) => {
                const w = docSnap.data();
                const id = docSnap.id;

                // Split image URLs (commas or split tag)
                let urls = [];
                if (w.url) {
                    urls = w.url.includes('---SPLIT---') 
                           ? w.url.split('---SPLIT---').map(u => u.trim()) 
                           : w.url.split(',').map(u => u.trim());
                }
                const mainImg = urls[0] || 'https://via.placeholder.com/400?text=No+Image';

                // Split Colors
                let colorsList = [];
                if (w.colors) {
                    colorsList = w.colors.split(',').map(c => c.trim()).filter(c => c.length > 0);
                }

                // Create Watch Card
                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl border border-[#e2dacb] overflow-hidden shadow-sm flex flex-col justify-between";

                // Build Thumbnails HTML
                let thumbsHtml = "";
                if (urls.length > 1) {
                    thumbsHtml = `<div class="flex gap-2 p-2 bg-[#fbf9f5] border-t border-[#e2dacb] overflow-x-auto">`;
                    urls.forEach((u, idx) => {
                        thumbsHtml += `<img src="${u}" class="thumb-img ${idx === 0 ? 'active-thumb' : ''}" data-card="${id}" data-url="${u}" onclick="switchImage('${id}', '${u}', this)">`;
                    });
                    thumbsHtml += `</div>`;
                }

                // Build Color Chips HTML
                let colorsHtml = "";
                if (colorsList.length > 0) {
                    colorsHtml = `<div class="mt-3">
                        <label class="text-[10px] font-bold text-[#5a6f56] block mb-1.5 uppercase tracking-wider">Available Colors:</label>
                        <div class="flex flex-wrap gap-1.5" id="colors-group-${id}">`;
                    colorsList.forEach((col, idx) => {
                        colorsHtml += `<button type="button" class="color-chip ${idx === 0 ? 'active' : ''}" onclick="selectColor('${id}', '${col}', this)">${col}</button>`;
                    });
                    colorsHtml += `</div></div>`;
                }

                card.innerHTML = `
                    <div>
                        <!-- Main Image Container -->
                        <div class="relative bg-[#fbf9f5] aspect-square flex items-center justify-center overflow-hidden">
                            <img id="main-img-${id}" src="${mainImg}" onerror="this.onerror=null;this.src='https://via.placeholder.com/400?text=Image+Error';" class="w-full h-full object-cover transition-all duration-300">
                            ${w.tag ? `<span class="absolute top-3 left-3 badge-tag">${w.tag}</span>` : ''}
                        </div>
                        
                        ${thumbsHtml}

                        <!-- Content Details -->
                        <div class="p-4">
                            <h3 class="text-base font-bold text-[#2b3a29] leading-tight">${w.name}</h3>
                            
                            <div class="flex items-center justify-between mt-2">
                                <span class="text-lg font-black text-[#2b3a29]">Rs. ${Number(w.price).toLocaleString()}</span>
                                <span class="text-[11px] font-semibold text-emerald-800 bg-emerald-50 px-2 py-0.5 rounded-md border border-emerald-200">
                                    ${w.stock > 0 ? `In Stock (${w.stock})` : 'Out of Stock'}
                                </span>
                            </div>

                            ${colorsHtml}
                        </div>
                    </div>

                    <!-- Buy / WhatsApp Order Button -->
                    <div class="p-4 pt-0">
                        <button type="button" id="buy-btn-${id}" onclick="orderOnWhatsApp('${w.name}', '${w.price}', '${id}')" 
                                ${w.stock <= 0 ? 'disabled' : ''}
                                class="w-full py-3 olive-btn rounded-xl uppercase text-xs tracking-wider flex items-center justify-center gap-2 shadow-xs transition-all disabled:opacity-50 disabled:cursor-not-allowed">
                            💬 Order on WhatsApp
                        </button>
                    </div>
                `;

                container.appendChild(card);
            });
        });

        // Gallery Image Switcher
        window.switchImage = (id, imgUrl, el) => {
            document.getElementById(`main-img-${id}`).src = imgUrl;
            const thumbs = document.querySelectorAll(`[data-card="${id}"]`);
            thumbs.forEach(t => t.classList.remove('active-thumb'));
            el.classList.add('active-thumb');
        };

        // Color Selection State
        const selectedColorsMap = {};
        window.selectColor = (id, colorName, el) => {
            selectedColorsMap[id] = colorName;
            const parent = document.getElementById(`colors-group-${id}`);
            const chips = parent.querySelectorAll('.color-chip');
            chips.forEach(c => c.classList.remove('active'));
            el.classList.add('active');
        };

        // WhatsApp Order Action
        window.orderOnWhatsApp = (name, price, id) => {
            const phoneNumber = "923000000000"; // Enter your official WhatsApp Number here (e.g., 923xxxxxxxx)
            const chosenColor = selectedColorsMap[id] || (document.querySelector(`#colors-group-${id} .active`)?.innerText || 'Standard');
            
            const message = `Hello TUE Watch Store! I would like to order:\n\n*Watch:* ${name}\n*Price:* Rs. ${Number(price).toLocaleString()}\n*Selected Color:* ${chosenColor}\n\nPlease confirm delivery availability.`;
            
            const whatsappUrl = `https://wa.me/${phoneNumber}?text=${encodeURIComponent(message)}`;
            window.open(whatsappUrl, '_blank');
        };
    </script>
</body>
</html>
